name: navms-project

channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # Base
  - pip
  - numpy=1.26.4
  - scipy=1.15.3
  - pandas=2.3.3
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - scikit-learn=1.7.2

  # Jupyter
  - ipython=8.38.0
  - ipykernel=7.1.0
  - jupyterlab
  - widgetsnbextension

  # Visualization / Graphics
  - open3d=0.19.0
  - plotly=6.7.0
  - trimesh=4.12.2
  - pygame=2.6.1

  # CUDA
  - cuda-toolkit=13.0.2

  # Pip-only packages
  - pip:
      # Deep Learning
      - torch==2.12.0
      - torchvision==0.27.0
      - xformers==0.0.35
      - triton==3.7.0

      # Vision
      - opencv-python==4.11.0.86
      - pillow==12.2.0
      - pillow_heif==1.3.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - moviepy==1.0.3

      # 3D / Geometry
      - pycolmap==4.0.4
      - plyfile==1.1.3
      - pyquaternion==0.9.9
      - e3nn==0.6.0

      # API / Backend
      - fastapi==0.136.1
      - uvicorn==0.47.0
      - flask==3.1.3
      - dash==4.1.0

      # Config / CLI
      - typer==0.25.1
      - rich==15.0.0
      - omegaconf==2.3.0
      - pyyaml==6.0.3
      - ruamel.yaml==0.19.1

      # HuggingFace
      - huggingface_hub==1.14.0
      - safetensors==0.4.3

      # Robotics / ROS
      - rosbags==0.11.2
      - evo==1.36.4

      # Custom Git dependencies
      - git+https://github.com/ByteDance-Seed/depth-anything-3@2c21ea849ceec7b469a3e62ea0c0e270afc3281a
      - git+https://github.com/NAVMS-FURG/graphs-interface.git@ef8fc0d5a301f6415f644c8c627552a64ec2947c
